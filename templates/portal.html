<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Review · Portale</title>
<style>
/* ── Token: istanza di riferimento dataviz (stessa palette di dashboard.html) ── */
:root {
  color-scheme: light;
  --plane: #f9f9f7; --surface-1: #fcfcfb; --surface-2: #f3f2ee;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --hover: rgba(11,11,11,0.05);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --q100: #cde2fb; --q200: #9ec5f4; --q300: #6da7ec; --q400: #3987e5; --q500: #256abf; --q600: #184f95; --q700: #0d366b;
  --status-good: #0ca30c; --status-warning: #fab219; --status-serious: #ec835a; --status-critical: #d03b3b;
  --delta-up: #006300; --delta-down: #b42828;
  --accent: #2a78d6; --accent-soft: rgba(42,120,214,0.10); --accent-strong: #184f95;
  --shadow-card: 0 1px 2px rgba(0,0,0,.06); --shadow-float: 0 2px 6px rgba(0,0,0,.16);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321;
    --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --hover: rgba(255,255,255,0.06);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --q100: #0d366b; --q200: #104281; --q300: #184f95; --q400: #1c5cab; --q500: #2a78d6; --q600: #5598e7; --q700: #9ec5f4;
    --delta-up: #0ca30c; --delta-down: #e66767; --accent: #3987e5; --accent-soft: rgba(57,135,229,0.16); --accent-strong: #5598e7;
    --shadow-card: 0 1px 2px rgba(0,0,0,.4); --shadow-float: 0 2px 8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane: #0d0d0d; --surface-1: #1a1a19; --surface-2: #232321;
  --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --hover: rgba(255,255,255,0.06);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --q100: #0d366b; --q200: #104281; --q300: #184f95; --q400: #1c5cab; --q500: #2a78d6; --q600: #5598e7; --q700: #9ec5f4;
  --delta-up: #0ca30c; --delta-down: #e66767; --accent: #3987e5; --accent-soft: rgba(57,135,229,0.16); --accent-strong: #5598e7;
  --shadow-card: 0 1px 2px rgba(0,0,0,.4); --shadow-float: 0 2px 8px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html { height: 100%; }
body { margin: 0; min-height: 100%; }
body {
  background: var(--plane); color: var(--text-primary);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  display: grid; grid-template-columns: 220px 1fr; grid-template-rows: auto 1fr;
  grid-template-areas: "side top" "side main";
}
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }

/* ── Shell ── */
#side {
  grid-area: side; background: var(--surface-1); border-right: 1px solid var(--border);
  padding: 16px 10px; position: sticky; top: 0; height: 100vh; overflow-y: auto; align-self: start;
}
.brand { font-weight: 700; font-size: 15px; padding: 4px 10px 2px; }
.brand-sub { color: var(--text-muted); font-size: 12px; padding: 0 10px 14px; }
.nav-group { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 14px 10px 4px; }
#side a.nav {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px;
  color: var(--text-secondary); text-decoration: none;
}
#side a.nav:hover { background: var(--hover); }
#side a.nav.active { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
#side a.nav .ico { width: 18px; text-align: center; }
#side .dash-link { padding-left: 38px; font-size: 13px; }

#top {
  grid-area: top; position: sticky; top: 0; z-index: 5;
  background: color-mix(in srgb, var(--plane) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--border); padding: 10px 24px;
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
}
#top .title { font-weight: 650; font-size: 16px; margin-right: auto; }
main { grid-area: main; padding: 20px 24px 64px; min-width: 0; }

.ctl {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; min-height: 34px;
}
select.ctl { padding-right: 26px; }
.btn {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; min-height: 34px; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.danger { color: var(--status-critical); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.sm { min-height: 28px; padding: 3px 9px; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface-1); padding: 6px 10px; cursor: pointer; min-height: 32px; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--surface-2); font-weight: 600; }
.seg button.on::before { content: "✓ "; font-weight: 700; }

/* ── Layout contenuti ── */
h1 { font-size: 22px; margin: 0 0 4px; }
.lede { color: var(--text-secondary); margin: 0 0 18px; }
.grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
.w3 { grid-column: span 3; } .w4 { grid-column: span 4; } .w6 { grid-column: span 6; }
.w8 { grid-column: span 8; } .w12 { grid-column: span 12; }
@media (max-width: 1100px) { .w3 { grid-column: span 6; } .w4, .w6, .w8 { grid-column: span 12; } }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-areas: "top" "main"; } #side { display: none; } .w3 { grid-column: span 12; } }

.card {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
  padding: 16px 18px; min-width: 0; position: relative;
}
.card-h { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.card-h .t { font-weight: 650; }
.card-h .st { color: var(--text-muted); font-size: 12px; }
.card-h .tools { margin-left: auto; display: flex; gap: 4px; }
.chart { width: 100%; position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.empty { color: var(--text-muted); padding: 28px 0; text-align: center; }

/* KPI / stat tile */
.kpi .v { font-size: 30px; font-weight: 650; line-height: 1.15; margin-top: 2px; }
.kpi .l { color: var(--text-secondary); font-size: 13px; }
.kpi .d { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.kpi .d .up { color: var(--delta-up); } .kpi .d .down { color: var(--delta-down); }

/* Assi / segni */
.ax text, .lbl { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.baseline { stroke: var(--axis); stroke-width: 1; }
.hit { fill: transparent; cursor: default; }
.hit:hover + .guide, .band:hover .guide { opacity: 1; }
.guide { stroke: var(--axis); stroke-width: 1; opacity: 0; pointer-events: none; }
.band:hover .bandbg { fill: var(--hover); }
.dlabel { fill: var(--text-secondary); font-size: 11px; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

#tip {
  position: fixed; z-index: 50; pointer-events: none; display: none;
  background: var(--surface-1); color: var(--text-primary); border: 1px solid var(--border);
  box-shadow: 0 6px 24px rgba(0,0,0,.14); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 320px;
}
#tip b { font-weight: 650; }
#tip .row { display: flex; gap: 10px; justify-content: space-between; }
#tip .row span:last-child { font-variant-numeric: tabular-nums; }

/* Tabelle */
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th, table.t td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t th { color: var(--text-muted); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface-1); cursor: default; }
table.t th.sort { cursor: pointer; }
table.t th.sort:hover { color: var(--text-primary); }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--hover); }
.scroll { overflow: auto; max-height: 560px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.muted { color: var(--text-muted); }
.ellip { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Chip severità: icona + etichetta, mai solo colore */
.sev { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; }
.sev::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.sev.critical { --c: var(--status-critical); } .sev.error { --c: var(--status-serious); }
.sev.warning { --c: var(--status-warning); } .sev.info { --c: var(--text-muted); }
.sev.clean { --c: var(--status-good); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.pill.fam::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--c); margin-right: 5px; }
.banner { border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; background: color-mix(in srgb, var(--status-warning) 16%, var(--surface-1)); border: 1px solid color-mix(in srgb, var(--status-warning) 50%, transparent); }

/* Report: lista giorni */
.days { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.day {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
  text-decoration: none; color: inherit; display: block;
}
.day:hover { background: var(--hover); }
.day .dd { font-weight: 650; }
.day .q { font-size: 22px; font-weight: 650; }
.day .meta { color: var(--text-muted); font-size: 12px; }

/* Markdown */
.md { line-height: 1.6; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 18px 0 8px; }
.md h1 { font-size: 20px; } .md h2 { font-size: 17px; } .md h3 { font-size: 15px; } .md h4 { font-size: 14px; }
.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
.md th, .md td { border: 1px solid var(--border); padding: 5px 8px; text-align: left; }
.md code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
.md pre { background: var(--surface-2); padding: 10px 12px; border-radius: 8px; overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { margin: 8px 0; padding: 4px 12px; border-left: 3px solid var(--axis); color: var(--text-secondary); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.tabs button { background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--text-secondary); border-bottom: 2px solid transparent; }
.tabs button.on { color: var(--text-primary); border-bottom-color: var(--accent); font-weight: 600; }

/* Drawer commit */
#drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 30; display: none; }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 96vw); z-index: 31; display: none;
  background: var(--surface-1); border-left: 1px solid var(--border); overflow-y: auto; padding: 20px 22px;
}
.diff { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre; overflow: auto; background: var(--surface-2); border-radius: 8px; padding: 10px; max-height: 60vh; }
.diff span { display: block; min-height: 1em; }
.diff .a { background: color-mix(in srgb, var(--status-good) 16%, transparent); display: block; }
.diff .r { background: color-mix(in srgb, var(--status-critical) 14%, transparent); display: block; }
.diff .h { color: var(--text-muted); display: block; }
.finding { border-left: 3px solid var(--c); padding: 6px 10px; margin: 8px 0; background: var(--surface-2); border-radius: 0 8px 8px 0; }

/* Modale widget */
dialog { border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1); color: var(--text-primary); padding: 20px; width: min(560px, 94vw); }
dialog::backdrop { background: rgba(0,0,0,.35); }
.form { display: grid; grid-template-columns: 140px 1fr; gap: 10px 12px; align-items: center; }
.form label { color: var(--text-secondary); font-size: 13px; }
.edit-bar { display: flex; gap: 4px; }
.editing .card { outline: 1px dashed var(--axis); }

/* Git-flow */
.gf { display: grid; grid-template-columns: auto 1fr; align-items: start; }
.gf-rows { min-width: 0; }
.gf-row {
  display: grid; grid-template-columns: 90px minmax(160px, 260px) 1fr 140px 120px 80px; gap: 10px;
  align-items: center; font-size: 12.5px; border-bottom: 1px solid transparent; padding-right: 6px;
}
.gf-row:hover { background: var(--hover); }
.gf-row.dim { opacity: .28; }
.gf-row.inds { cursor: pointer; }
.gf-head { color: var(--text-muted); font-size: 11px; font-weight: 600; }
.gf svg .node.dim, .gf svg path.dim { opacity: .22; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--axis); margin-right: 4px; }
.chk { display: inline-flex; align-items: center; gap: 5px; margin-right: 12px; font-size: 13px; cursor: pointer; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.sr { position: absolute; left: -9999px; }

/* ═══ Skin SLDS: raggi 4px, bordi hairline, ombre leggere, brand pieno sulle azioni primarie ═══ */
:focus-visible { outline: none; box-shadow: 0 0 0 1px var(--accent), 0 0 3px var(--accent); }
#side a.nav { border-radius: 4px; padding: 6px 10px; }
#side a.nav.active { background: var(--accent-soft); font-weight: 700; }
#top { background: var(--surface-1); backdrop-filter: none; }
#top .title { font-weight: 700; }
h1 { font-size: 20px; font-weight: 700; line-height: 1.25; }
h3 { font-size: 14px; font-weight: 700; margin: 20px 0 10px; }
.ctl { border-radius: 4px; border-color: var(--axis); min-height: 32px; padding: 4px 10px; }
.btn { border-radius: 4px; border-color: var(--axis); min-height: 32px; padding: 4px 14px; font-size: 13px; color: var(--accent); font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
.btn.ghost { color: var(--text-secondary); font-weight: 400; }
.btn.sm { min-height: 24px; padding: 1px 8px; font-size: 12px; }
.btn.danger { color: var(--status-critical); }
.seg { border-radius: 4px; border-color: var(--axis); }
.seg button { min-height: 30px; padding: 4px 12px; font-size: 13px; }
.seg button + button { border-left-color: var(--axis); }
.seg button.on { background: var(--accent); color: #fff; font-weight: 600; }
.seg button.on::before { content: none; }
.card { border-radius: 4px; border-color: var(--grid); box-shadow: var(--shadow-card); padding: 12px 16px 16px; }
.card-h .t { font-weight: 700; font-size: 13px; }
.kpi .v { font-weight: 300; }
.kpi .l { font-weight: 700; color: var(--text-primary); }
table.t th { text-transform: uppercase; letter-spacing: .04em; font-size: 11px; font-weight: 700; color: var(--text-secondary); background: var(--surface-2); }
.pill { border-radius: 15px; }
.tabs { gap: 2px; }
.tabs button { border-bottom-width: 3px; font-size: 13px; }
.tabs button.on { font-weight: 700; }
#tip { border-radius: 4px; box-shadow: var(--shadow-float); }
#drawer { box-shadow: -2px 0 12px rgba(0,0,0,.18); }
.finding { border: 1px solid var(--grid); border-left: 1px solid var(--grid); border-radius: 4px; background: var(--surface-1); padding: 8px 12px; }
.finding .fx { color: var(--text-secondary); font-size: 12px; margin-top: 2px; }
.diff { border-radius: 4px; }
.banner { border-radius: 4px; }

/* Sidebar: dashboard predefinita vs personali */
.dash-tree { margin: 2px 0 6px 18px; padding-left: 8px; border-left: 1px solid var(--grid); display: flex; flex-direction: column; gap: 1px; }
.dash-tree .sub { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-muted); padding: 6px 8px 2px; }
.dash-tree .sub a { color: var(--accent); font-size: 15px; line-height: 1; text-decoration: none; padding: 0 2px; }
#side .dash-tree a.nav.dash-link { padding: 4px 8px; font-size: 13px; gap: 6px; }
.dash-link .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot-tile { flex: none; width: 11px; height: 11px; border-radius: 3px; background: var(--c); }
.lock { flex: none; color: var(--text-muted); }

/* Header dashboard */
.dh { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.dh .tile { width: 32px; height: 32px; border-radius: 4px; display: grid; place-items: center; flex: none; }
.dh .tile.sys { background: var(--surface-2); border: 1px solid var(--grid); color: var(--text-secondary); }
.dh .tile.usr { background: var(--c); color: #fff; font-weight: 700; }
.dh .kind { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .05em; }
.dh h1 { margin: 0; }
.dh .meta { font-size: 12px; color: var(--text-muted); }
.dh .acts { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.badge { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 15px; font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--grid); text-transform: uppercase; letter-spacing: .04em; }
.hint { font-size: 12px; color: var(--text-secondary); }

/* Barra Oggi */
.today { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: center; padding: 10px 16px; margin-bottom: 16px; border-radius: 4px; background: var(--surface-1); border: 1px solid var(--grid); font-size: 13px; }
.today a { color: var(--text-primary); text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }
.today a:hover .lnk { text-decoration: underline; }
.today .lnk { color: var(--accent); }
.today .q { margin-left: auto; color: var(--text-secondary); }
.today .q strong { color: var(--text-primary); font-variant-numeric: tabular-nums; }

/* Modifica dashboard */
.editing .card { outline: 0; border: 1px dashed var(--axis); }
.editing .card.over { border-color: var(--accent); }
.editing .card.over::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 2px; background: var(--accent); }
.editing .card.dragging { opacity: .4; }
.editing .card.resizing { border: 1px solid var(--accent); }
.drag { cursor: grab; color: var(--text-muted); font-size: 14px; line-height: 20px; padding: 0 2px; user-select: none; }
.rz { position: absolute; top: 0; right: -9px; bottom: 0; width: 14px; cursor: ew-resize; display: flex; align-items: center; justify-content: center; z-index: 2; }
.rz::after { content: ""; width: 4px; height: 32px; border-radius: 2px; background: var(--axis); }
.rz:hover::after, .resizing .rz::after { background: var(--accent); }
.wchips { position: absolute; left: 50%; bottom: -11px; transform: translateX(-50%); display: flex; background: var(--surface-1); border: 1px solid var(--grid); border-radius: 4px; overflow: hidden; box-shadow: var(--shadow-float); z-index: 2; }
.wchips button { border: 0; background: transparent; padding: 1px 8px; font-size: 11px; cursor: pointer; color: var(--text-secondary); }
.wchips button.on { background: var(--accent); color: #fff; }
.editing .grid, .grid.editing { row-gap: 24px; }
.add-tile { grid-column: span 3; min-height: 120px; border: 1px dashed var(--axis); border-radius: 4px; background: transparent; color: var(--accent); font-size: 13px; cursor: pointer; }
.add-tile:hover { background: var(--accent-soft); border-color: var(--accent); }

/* Report: card giorno */

<script>
"use strict";
// ═════════════════════════════════════════════════════════════
//  STATO & UTILITÀ
// ═════════════════════════════════════════════════════════════
const S = { data: null, commits: [], days: [], repos: [], dashboards: [], editing: false,
  f: { range: "all", from: "", to: "", repo: "", author: "" }, kb: null };
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtN = (v, d = 0) => v == null || Number.isNaN(v) ? "—" : Number(v).toLocaleString("it-IT", { minimumFractionDigits: d, maximumFractionDigits: d });
const MESI = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
const GIORNI = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];
const dm = s => `${s.slice(8, 10)}/${s.slice(5, 7)}`;
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const parseDay = s => new Date(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const addDays = (s, n) => { const d = parseDay(s); d.setDate(d.getDate() + n); return iso(d); };
const weekKey = s => { const d = parseDay(s.slice(0, 10)); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return iso(d); };
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const uid = () => Math.random().toString(36).slice(2, 10);

const SEV = ["critical", "error", "warning", "info"];
const SEV_META = {
  critical: { label: "Critical", icon: "⛔", color: "var(--status-critical)" },
  error: { label: "Error", icon: "✖", color: "var(--status-serious)" },
  warning: { label: "Warning", icon: "▲", color: "var(--status-warning)" },
  info: { label: "Info", icon: "ℹ", color: "var(--text-muted)" },
  clean: { label: "Pulito", icon: "✓", color: "var(--status-good)" },
};
const sevChip = s => `<span class="sev ${s}">${SEV_META[s]?.icon || ""} ${SEV_META[s]?.label || s}</span>`;

// Famiglie di branch: slot categorici in ordine fisso (il colore segue l'entità).
const FAMILIES = ["main", "develop", "release", "hotfix", "feature", "bugfix", "other"];
const FAM_LABEL = { main: "main/master", develop: "develop", release: "release", hotfix: "hotfix", feature: "feature", bugfix: "bugfix/fix", other: "altro" };
const FAM_COLOR = { main: "var(--s1)", develop: "var(--s2)", release: "var(--s3)", hotfix: "var(--s8)", feature: "var(--s7)", bugfix: "var(--s6)", other: "var(--text-muted)" };
function family(b) {

  if (n === "main" || n === "master") return "main";
  if (["develop", "development", "dev"].includes(n)) return "develop";
  for (const f of ["release", "hotfix"]) if (n.startsWith(f) || n.includes("/" + f)) return f;
  for (const f of ["feature", "bugfix"]) if (n.startsWith(f)) return f;
  if (n.startsWith("fix")) return "bugfix";
  return "other";
}
const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)", "var(--s5)", "var(--s6)", "var(--s7)", "var(--s8)"];

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(`${r.status} ${path}`);
  return r.json();
}

// ═════════════════════════════════════════════════════════════
//  MOTORE DI AGGREGAZIONE
// ═════════════════════════════════════════════════════════════
const DIMS = {
  day: { label: "Giorno", time: "day", key: c => [c.date.slice(0, 10)] },
  week: { label: "Settimana", time: "week", key: c => [weekKey(c.date)] },
  month: { label: "Mese", time: "month", key: c => [c.date.slice(0, 7)] },
  author: { label: "Autore", key: c => [c.author || "?"] },
  repo: { label: "Repository", key: c => [c.repo] },
  branch: { label: "Branch", key: c => [c.branch || "?"] },
  family: { label: "Tipo branch", key: c => [family(c.branch)], fmt: k => FAM_LABEL[k] || k, color: k => FAM_COLOR[k] },
  weekday: { label: "Giorno della settimana", key: c => [(parseDay(c.date).getDay() + 6) % 7], fmt: k => GIORNI[k], order: "key" },
  hour: { label: "Ora del giorno", key: c => [+c.date.slice(11, 13)], fmt: k => `${k}:00`, order: "key" },
  severity: { label: "Severità finding", unit: "finding", key: f => [f.severity], fmt: k => SEV_META[k] ? `${SEV_META[k].icon} ${SEV_META[k].label}` : k, color: k => SEV_META[k]?.color, order: k => SEV.indexOf(k) },
  gate: { label: "Gate / regola", unit: "finding", key: f => [f.rule_id || "?"] },
  directory: { label: "Directory", unit: "file", key: c => [...new Set((c.files || []).map(dirOf))] },
  file: { label: "File", unit: "file", key: c => [...new Set(c.files || [])] },
  quality_band: { label: "Fascia quality", key: c => c.quality == null ? [] : [c.quality >= 9 ? "9–10" : c.quality >= 7 ? "7–8" : c.quality >= 5 ? "5–6" : "1–4"], order: "key" },
};
function dirOf(p) { const parts = p.split("/"); parts.pop(); return parts.slice(0, 3).join("/") || "/"; }

const METRICS = {
  commits: { label: "Commit", f: g => g.commits.length },
  quality: { label: "Quality media", dec: 1, max: 10, f: g => avg(g.commits.map(c => c.quality).filter(q => q != null)) },
  findings: { label: "Finding", f: g => g.findings.length },
  blocking: { label: "Finding critical+error", f: g => g.findings.filter(f => f.severity === "critical" || f.severity === "error").length },
  churn: { label: "Righe modificate (+/−)", f: g => g.commits.reduce((s, c) => s + c.ins + c.del, 0) },
  ins: { label: "Righe aggiunte", f: g => g.commits.reduce((s, c) => s + c.ins, 0) },
  del: { label: "Righe rimosse", f: g => g.commits.reduce((s, c) => s + c.del, 0) },
  files: { label: "File toccati", f: g => g.commits.reduce((s, c) => s + c.files_changed, 0) },
  reviewed: { label: "% commit revisionati", dec: 0, max: 100, suffix: "%", f: g => g.commits.length ? 100 * g.commits.filter(c => c.reviewed).length / g.commits.length : null },
  authors: { label: "Autori attivi", f: g => new Set(g.commits.map(c => c.author)).size },
  avg_size: { label: "Righe per commit (media)", f: g => avg(g.commits.map(c => c.ins + c.del)) },
};

/** Raggruppa commit per dimensione. Le dimensioni "finding" esplodono i finding. */
function group(commits, dimKey) {
  const dim = DIMS[dimKey];
  const m = new Map();
  const get = k => { if (!m.has(k)) m.set(k, { key: k, commits: [], findings: [], _seen: new Set() }); return m.get(k); };
  for (const c of commits) {
    if (dim.unit === "finding") {
      for (const f of c.findings) for (const k of dim.key(f)) {
        const g = get(k); g.findings.push({ ...f, _c: c });
        if (!g._seen.has(c.id)) { g._seen.add(c.id); g.commits.push(c); }
      }
    } else {
      for (const k of dim.key(c)) { const g = get(k); g.commits.push(c); g.findings.push(...c.findings.map(f => ({ ...f, _c: c }))); }
    }
  }
  return m;
}

/** Bucket temporali continui (i buchi restano a zero / null, mai interpolati). */
function timeBuckets(kind, from, to) {
  const out = [];
  if (!from || !to) return out;
  if (kind === "day") for (let d = from; d <= to; d = addDays(d, 1)) out.push(d);
  else if (kind === "week") for (let d = weekKey(from); d <= to; d = addDays(d, 7)) out.push(d);
  else { let y = +from.slice(0, 4), mo = +from.slice(5, 7); const ey = +to.slice(0, 4), em = +to.slice(5, 7);
    while (y < ey || (y === ey && mo <= em)) { out.push(`${y}-${String(mo).padStart(2, "0")}`); mo++; if (mo > 12) { mo = 1; y++; } } }
  return out;
}
function timeLabel(kind, k) {
  if (kind === "month") return `${MESI[+k.slice(5, 7) - 1]} ${k.slice(2, 4)}`;
  return dm(k);
}

function aggregate(commits, dimKey, metricKey, opts = {}) {
  const dim = DIMS[dimKey], met = METRICS[metricKey];
  const g = group(commits, dimKey);
  let keys;
  if (dim.time) {
    const [from, to] = effectiveRange(commits);
    keys = timeBuckets(dim.time, from, to);
  } else {
    keys = [...g.keys()];
  }
  let rows = keys.map(k => {
    const grp = g.get(k) || { key: k, commits: [], findings: [] };
    return { key: k, label: dim.time ? timeLabel(dim.time, k) : (dim.fmt ? dim.fmt(k) : String(k)), value: met.f(grp), group: grp };
  });
  if (!dim.time) {
    if (dim.order === "key") rows.sort((a, b) => (a.key > b.key ? 1 : -1));
    else if (typeof dim.order === "function") rows.sort((a, b) => dim.order(a.key) - dim.order(b.key));
    else rows.sort((a, b) => (b.value ?? -1) - (a.value ?? -1));
    rows = rows.filter(r => r.value != null && (r.value !== 0 || dim.order));
    if (opts.top && rows.length > opts.top) rows = rows.slice(0, opts.top);
  }
  return rows;
}

/** Serie multiple per split (stacked / multi-linea). Oltre 7 valori → "Altri". */
function splitSeries(commits, dimKey, metricKey, splitKey) {
  const sdim = DIMS[splitKey];
  const totals = [...group(commits, splitKey).values()].map(g => ({ key: g.key, v: METRICS[metricKey].f(g) || 0 }));
  if (typeof sdim.order === "function") totals.sort((a, b) => sdim.order(a.key) - sdim.order(b.key));
  else totals.sort((a, b) => b.v - a.v);
  let keys = totals.map(t => t.key);
  const fixedColor = !!sdim.color;
  let other = false;
  if (!fixedColor && keys.length > 7) { keys = keys.slice(0, 7); other = true; }
  // Colore stabile per entità (non per rango): indice nell'ordinamento globale del dataset.
  const colorOf = k => sdim.color ? sdim.color(k) : SERIES[stableIndex(splitKey, k) % 8];
  const base = aggregate(commits, dimKey, "commits");
  const series = keys.map(k => ({ key: k, name: sdim.fmt ? sdim.fmt(k) : String(k), color: colorOf(k), values: [] }));
  if (other) series.push({ key: "__other", name: "Altri", color: "var(--text-muted)", values: [] });
  for (const b of base) {
    const sub = group(b.group.commits, splitKey);
    for (const s of series) {
      let grp;
      if (s.key === "__other") {
        const rest = [...sub.entries()].filter(([k]) => !keys.includes(k));
        grp = { commits: [...new Set(rest.flatMap(([, g]) => g.commits))], findings: rest.flatMap(([, g]) => g.findings) };
      } else grp = sub.get(s.key) || { commits: [], findings: [] };
      s.values.push(METRICS[metricKey].f(grp));
    }
  }
  return { buckets: base.map(b => ({ key: b.key, label: b.label })), series };
}
const _stable = {};
function stableIndex(dimKey, k) {
  if (!_stable[dimKey]) {
    const all = [...group(S.commits, dimKey).values()].sort((a, b) => b.commits.length - a.commits.length || String(a.key).localeCompare(String(b.key)));
    _stable[dimKey] = new Map(all.map((g, i) => [g.key, i]));
  }
  return _stable[dimKey].get(k) ?? 7;
}

// ═════════════════════════════════════════════════════════════
//  FILTRI
// ═════════════════════════════════════════════════════════════
const RANGES = [["7", "7 gg"], ["30", "30 gg"], ["90", "90 gg"], ["all", "Tutto"]];
function lastDay() { return S.days.length ? S.days[S.days.length - 1].date : iso(new Date()); }
function firstDay() { return S.days.length ? S.days[0].date : iso(new Date()); }
function rangeBounds() {
  const f = S.f;
  if (f.range === "custom") return [f.from || firstDay(), f.to || lastDay()];
  if (f.range === "all") return [firstDay(), lastDay()];
  const to = lastDay(); return [addDays(to, -(+f.range - 1)), to];
}
function effectiveRange() { return rangeBounds(); }
function applyFilters(commits, extra = {}) {
  const [from, to] = rangeBounds();
  return commits.filter(c => {
    const d = c.date.slice(0, 10);
    if (d < from || d > to) return false;
    const repo = extra.repo || S.f.repo, author = extra.author || S.f.author;
    if (repo && c.repo !== repo) return false;
    if (author && c.author !== author) return false;
    if (extra.family && family(c.branch) !== extra.family) return false;
    if (extra.severity && !c.findings.some(f => f.severity === extra.severity)) return false;
    if (extra.reviewed === "yes" && !c.reviewed) return false;
    if (extra.reviewed === "no" && c.reviewed) return false;
    return true;
  });
}
function previousPeriod(commits, extra) {
  const [from, to] = rangeBounds();
  const n = Math.round((parseDay(to) - parseDay(from)) / 864e5) + 1;
  const pf = addDays(from, -n), pt = addDays(from, -1);
  return S.commits.filter(c => { const d = c.date.slice(0, 10); return d >= pf && d <= pt; })
    .filter(c => (!(extra.repo || S.f.repo) || c.repo === (extra.repo || S.f.repo)) && (!(extra.author || S.f.author) || c.author === (extra.author || S.f.author)));
}
function initFilters() {
  $("#range-seg").innerHTML = RANGES.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join("");
  $("#range-seg").onclick = e => { const k = e.target.dataset.k; if (!k) return; S.f.range = k; syncFilters(); rerender(); };
  const repos = [...new Set(S.commits.map(c => c.repo))].sort();
  $("#f-repo").innerHTML = `<option value="">Tutti i repository</option>` + repos.map(r => `<option>${esc(r)}</option>`).join("");
  const authors = [...new Set(S.commits.map(c => c.author))].sort();
  $("#f-author").innerHTML = `<option value="">Tutti gli autori</option>` + authors.map(a => `<option>${esc(a)}</option>`).join("");
  $("#f-repo").onchange = e => { S.f.repo = e.target.value; rerender(); };
  $("#f-author").onchange = e => { S.f.author = e.target.value; rerender(); };
  $("#f-from").onchange = e => { S.f.range = "custom"; S.f.from = e.target.value; syncFilters(); rerender(); };
  $("#f-to").onchange = e => { S.f.range = "custom"; S.f.to = e.target.value; syncFilters(); rerender(); };
  syncFilters();
}
function syncFilters() {
  $$("#range-seg button").forEach(b => b.classList.toggle("on", b.dataset.k === S.f.range));
  const [from, to] = rangeBounds();
  $("#f-from").value = from; $("#f-to").value = to;
  $("#f-repo").value = S.f.repo; $("#f-author").value = S.f.author;
}

// ═════════════════════════════════════════════════════════════
//  GRAFICI SVG
// ═════════════════════════════════════════════════════════════
const PAD = { l: 44, r: 16, t: 14, b: 34 };
function niceMax(v) {
  if (v <= 0 || v == null) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * p) return m * p;
  return 10 * p;
}
function ticks(max) { const m = max / Math.pow(10, Math.floor(Math.log10(max))); const n = [2.5, 5].includes(m) ? 5 : 4;
  return Array.from({ length: n + 1 }, (_, i) => max * i / n); }
function fmtTick(v) { return v >= 1000 ? `${fmtN(v / 1000, v % 1000 ? 1 : 0)}k` : fmtN(v, v % 1 ? 1 : 0); }
function yAxis(W, H, max, suffix = "") {
  return ticks(max).map(t => { const y = PAD.t + (H - PAD.t - PAD.b) * (1 - t / max);
    return `<line class="gridline" x1="${PAD.l}" x2="${W - PAD.r}" y1="${y}" y2="${y}"/><text class="ax lbl" x="${PAD.l - 8}" y="${y + 4}" text-anchor="end">${fmtTick(t)}${suffix}</text>`; }).join("");
}
function xLabels(labels, x, H, bw) {
  const maxN = Math.max(2, Math.floor((x(labels.length - 1) - x(0) + bw) / 46));
  const step = Math.max(1, Math.ceil(labels.length / maxN));
  return labels.map((l, i) => i % step === 0 || i === labels.length - 1 && labels.length < 4 ? `<text class="ax lbl" x="${x(i)}" y="${H - PAD.b + 16}" text-anchor="middle">${esc(l)}</text>` : "").join("");
}
function tipAttr(html) { return `data-tip="${esc(html)}"`; }
function tipRows(title, rows) { return `<b>${esc(title)}</b>` + rows.map(([k, v, c]) => `<div class="row"><span>${c ? `<span class="sw" style="display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:${c}"></span>` : ""}${esc(k)}</span><span>${esc(v)}</span></div>`).join(""); }
function colPath(x, y, w, h, r = 4) {
  if (h <= 0) return ""; r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function hbarPath(x, y, w, h, r = 4) {
  if (w <= 0) return ""; r = Math.min(r, h / 2, w);
  return `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`;
}
function legendHTML(series) {
  if (series.length < 2) return "";
  return `<div class="legend">${series.map(s => `<span><span class="sw" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>`;
}

/** Linea (1+ serie) con crosshair a banda. I null spezzano la linea. */
function lineChart(el, buckets, series, met) {
  const W = Math.max(320, el.clientWidth), H = 240;
  const n = buckets.length;
  if (!n) return el.innerHTML = `<div class="empty">Nessun dato nel periodo</div>`;
  const vals = series.flatMap(s => s.values).filter(v => v != null);
  const max = met.max && vals.length && Math.max(...vals) > met.max * 0.5 ? met.max : niceMax(Math.max(0, ...vals));
  const iw = W - PAD.l - PAD.r, bw = iw / n;
  const x = i => PAD.l + bw * i + bw / 2, y = v => PAD.t + (H - PAD.t - PAD.b) * (1 - v / max);
  let svg = yAxis(W, H, max, met.suffix || "") + `<line class="baseline" x1="${PAD.l}" x2="${W - PAD.r}" y1="${H - PAD.b}" y2="${H - PAD.b}"/>`;
  for (const s of series) {
    let d = "", pen = false;
    s.values.forEach((v, i) => { if (v == null) { pen = false; return; } d += `${pen ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.values.forEach((v, i) => {
      const isolated = v != null && (i === 0 || s.values[i - 1] == null) && (i === n - 1 || s.values[i + 1] == null);
      if (v != null && (n <= 40 || isolated)) svg += `<circle cx="${x(i)}" cy="${y(v)}" r="${n <= 40 ? 3.5 : 4}" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
    });
  }
  // Etichette dirette sull'ultimo valore (≤ 4 serie), distanziate per non sovrapporsi.
  if (series.length <= 4) {
    const labs = series.map(s => { const li = s.values.map((v, i) => v != null ? i : -1).filter(i => i >= 0).pop();
      return li == null ? null : { x: x(li), y: y(s.values[li]) - 7, t: `${fmtN(s.values[li], met.dec || 0)}${met.suffix || ""}` }; }).filter(Boolean)
      .sort((a, b) => a.y - b.y);
    for (let k = 1; k < labs.length; k++) if (Math.abs(labs[k].x - labs[k - 1].x) < 40 && labs[k].y - labs[k - 1].y < 13) labs[k].y = labs[k - 1].y + 13;
    for (const l of labs) svg += `<text class="dlabel" x="${Math.min(l.x + 6, W - 2)}" y="${l.y}" text-anchor="${l.x > W - 60 ? "end" : "start"}">${l.t}</text>`;
  }
  buckets.forEach((b, i) => {
    const rows = series.map(s => [s.name, s.values[i] == null ? "n/d" : fmtN(s.values[i], met.dec || 0) + (met.suffix || ""), series.length > 1 ? s.color : null]);
    svg += `<g class="band" ${tipAttr(tipRows(b.label, series.length > 1 ? rows : [[met.label, rows[0][1]]]))}><rect class="bandbg" x="${PAD.l + bw * i}" y="${PAD.t}" width="${bw}" height="${H - PAD.t - PAD.b}" fill="transparent"/><line class="guide" x1="${x(i)}" x2="${x(i)}" y1="${PAD.t}" y2="${H - PAD.b}"/></g>`;
  });
  svg += xLabels(buckets.map(b => b.label), x, H, bw);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(met.label)}">${svg}</svg>` + legendHTML(series);
}

/** Colonne singole o impilate (gap 2px tra segmenti). */
function columnChart(el, buckets, series, met, stacked) {
  const W = Math.max(320, el.clientWidth), H = 240, n = buckets.length;
  if (!n) return el.innerHTML = `<div class="empty">Nessun dato nel periodo</div>`;
  const totals = buckets.map((_, i) => series.reduce((s, se) => s + (se.values[i] || 0), 0));
  const max = niceMax(Math.max(0, ...(stacked ? totals : series.flatMap(s => s.values.map(v => v || 0)))));
  const iw = W - PAD.l - PAD.r, slot = iw / n, bw = Math.max(2, Math.min(28, slot * 0.7));
  const x = i => PAD.l + slot * i + slot / 2;
  const sy = v => (H - PAD.t - PAD.b) * (v / max);
  let svg = yAxis(W, H, max, met.suffix || "");
  buckets.forEach((b, i) => {
    let base = H - PAD.b;
    const segs = stacked ? series : [series[0]];
    const visible = segs.filter(s => (s.values[i] || 0) > 0);
    visible.forEach((s, j) => {
      const v = s.values[i] || 0, h = sy(v); const top = j === visible.length - 1;
      const gap = j > 0 ? 2 : 0;
      svg += top ? `<path d="${colPath(x(i) - bw / 2, base - h + gap, bw, h - gap)}" fill="${s.color}"/>`
        : `<rect x="${x(i) - bw / 2}" y="${base - h + gap}" width="${bw}" height="${Math.max(0, h - gap)}" fill="${s.color}"/>`;
      base -= h;
    });
    const rows = stacked ? series.map(s => [s.name, fmtN(s.values[i] || 0, met.dec || 0), s.color]).concat(series.length > 1 ? [["Totale", fmtN(totals[i], met.dec || 0)]] : []) : [[met.label, fmtN(series[0].values[i], met.dec || 0) + (met.suffix || "")]];
    svg += `<g class="band" ${tipAttr(tipRows(b.label, rows))}><rect class="bandbg" x="${PAD.l + slot * i}" y="${PAD.t}" width="${slot}" height="${H - PAD.t - PAD.b}" fill="transparent"/></g>`;
  });
  svg += `<line class="baseline" x1="${PAD.l}" x2="${W - PAD.r}" y1="${H - PAD.b}" y2="${H - PAD.b}"/>`;
  svg += xLabels(buckets.map(b => b.label), x, H, slot);
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(met.label)}">${svg}</svg>` + legendHTML(stacked ? series : []);
}

/** Barre orizzontali con etichetta di valore a fine barra. */
function hbarChart(el, rows, met, colorFn) {
  const W = Math.max(320, el.clientWidth);
  if (!rows.length) return el.innerHTML = `<div class="empty">Nessun dato nel periodo</div>`;
  const RH = 26, labelW = Math.min(220, Math.max(90, W * 0.34)), H = rows.length * RH + 6;
  const max = met.max || niceMax(Math.max(...rows.map(r => r.value || 0)));
  const iw = W - labelW - 56;
  let svg = "";
  rows.forEach((r, i) => {
    const y = i * RH + 4, w = iw * ((r.value || 0) / max);
    const maxCh = Math.floor((labelW - 12) / 6.4), raw = r.label === "/" ? "(root)" : r.label;
    const lab = raw.length > maxCh ? "…" + raw.slice(-(maxCh - 1)) : raw;
    svg += `<g class="band" ${tipAttr(tipRows(r.label, [[met.label, fmtN(r.value, met.dec || 0) + (met.suffix || "")], ["Commit", fmtN(r.group.commits.length)]]))}>
      <rect class="bandbg" x="0" y="${y - 2}" width="${W}" height="${RH}" fill="transparent"/>
      <text class="lbl" x="${labelW - 8}" y="${y + 14}" text-anchor="end" style="fill:var(--text-secondary);font-size:12px">${esc(lab)}</text>
      <path d="${hbarPath(labelW, y + 3, Math.max(w, 1), 16)}" fill="${colorFn ? colorFn(r.key) : "var(--s1)"}"/>
      <text class="dlabel" x="${labelW + Math.max(w, 1) + 6}" y="${y + 15}">${fmtN(r.value, met.dec || 0)}${met.suffix || ""}</text></g>`;
  });
  svg += `<line class="baseline" x1="${labelW}" x2="${labelW}" y1="0" y2="${H}"/>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(met.label)}">${svg}</svg>`;
}

/** Heatmap giorno×ora, rampa sequenziale a una tinta. */
function heatmap(el, commits, metKey) {
  const met = METRICS[metKey];
  const W = Math.max(320, el.clientWidth), lw = 38, cols = 24, rowsN = 7;
  const cw = (W - lw - 8) / cols, ch = Math.min(26, Math.max(16, cw)), H = rowsN * ch + 24;
  const cells = Array.from({ length: 7 }, () => Array.from({ length: 24 }, () => ({ commits: [], findings: [] })));
  for (const c of commits) { const wd = (parseDay(c.date).getDay() + 6) % 7, h = +c.date.slice(11, 13); cells[wd][h].commits.push(c); cells[wd][h].findings.push(...c.findings); }
  const vals = cells.flat().map(g => met.f(g) || 0), max = Math.max(1, ...vals);
  const ramp = ["var(--q100)", "var(--q200)", "var(--q300)", "var(--q400)", "var(--q500)", "var(--q600)", "var(--q700)"];
  let svg = "";
  cells.forEach((row, d) => {
    svg += `<text class="lbl" x="${lw - 6}" y="${d * ch + ch / 2 + 4}" text-anchor="end">${GIORNI[d]}</text>`;
    row.forEach((g, h) => {
      const v = met.f(g) || 0;
      const fill = v === 0 ? "var(--surface-2)" : ramp[Math.min(6, Math.floor((v / max) * 6.999))];
      svg += `<rect x="${lw + h * cw + 1}" y="${d * ch + 1}" width="${cw - 2}" height="${ch - 2}" rx="3" fill="${fill}" ${tipAttr(tipRows(`${GIORNI[d]} ${h}:00–${h + 1}:00`, [[met.label, fmtN(v, met.dec || 0)]]))}/>`;
    });
  });
  for (let h = 0; h < 24; h += 3) svg += `<text class="lbl" x="${lw + h * cw + cw / 2}" y="${rowsN * ch + 16}" text-anchor="middle">${h}</text>`;
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Heatmap ${esc(met.label)}">${svg}</svg>
    <div class="legend"><span>meno</span>${ramp.map(c => `<span class="sw" style="background:${c};margin:0"></span>`).join("")}<span>più (max ${fmtN(max, met.dec || 0)})</span></div>`;
}

function tableFromRows(headers, rows) {
  return `<div class="scroll"><table class="t"><thead><tr>${headers.map(h => `<th class="${h.n ? "n" : ""}">${esc(h.l)}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${headers[i].n ? "n" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

// Tooltip globale (delegato su data-tip)
document.addEventListener("mousemove", e => {
  const t = e.target.closest?.("[data-tip]"), tip = $("#tip");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.getAttribute("data-tip"); tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

// ═════════════════════════════════════════════════════════════
//  WIDGET
// ═════════════════════════════════════════════════════════════
const WTYPES = {
  kpi: "Numero (KPI)", line: "Linea nel tempo", column: "Colonne nel tempo", stacked: "Colonne impilate nel tempo",
  hbar: "Barre orizzontali (classifica)", heatmap: "Heatmap giorno × ora", commits: "Tabella commit", findings: "Tabella finding",
};
const TIME_DIMS = ["day", "week", "month"];
const CAT_DIMS = Object.keys(DIMS).filter(k => !DIMS[k].time);

function renderWidget(w, host) {
  const extra = w.filters || {};
  const commits = applyFilters(S.commits, extra);
  const met = METRICS[w.metric] || METRICS.commits;
  const body = $(".chart", host);
  const tbl = host.dataset.table === "1";
  if (w.type === "kpi") {
    const v = met.f({ commits, findings: commits.flatMap(c => c.findings) });
    let delta = "";
    if (S.f.range !== "all") {
      const prev = previousPeriod(commits, extra);
      const pv = met.f({ commits: prev, findings: prev.flatMap(c => c.findings) });
      if (v != null && pv != null && prev.length) {
        const diff = v - pv, good = w.metric === "blocking" || w.metric === "findings" ? diff < 0 : diff > 0;
        delta = diff === 0 ? `<div class="d">= periodo precedente</div>` :
          `<div class="d"><span class="${good ? "up" : "down"}">${diff > 0 ? "▲" : "▼"} ${fmtN(Math.abs(diff), met.dec || 0)}${met.suffix || ""}</span> vs periodo precedente</div>`;
      } else delta = `<div class="d">periodo precedente: nessun dato</div>`;
    }
    body.innerHTML = `<div class="kpi"><div class="v">${fmtN(v, met.dec || 0)}${v != null ? (met.suffix || "") : ""}${w.metric === "quality" && v != null ? `<span class="muted" style="font-size:15px;font-weight:400">/10</span>` : ""}</div>${delta}</div>`;
    return;
  }
  if (w.type === "commits" || w.type === "findings") return renderTableWidget(w, body, commits);
  if (w.type === "heatmap") return tbl ? body.innerHTML = heatTable(commits, w.metric) : heatmap(body, commits, w.metric);
  if (w.type === "hbar") {
    const rows = aggregate(commits, w.dim || "author", w.metric, { top: w.top || 10 });
    const colorFn = DIMS[w.dim]?.color;
    if (tbl) return body.innerHTML = tableFromRows([{ l: DIMS[w.dim].label }, { l: met.label, n: 1 }, { l: "Commit", n: 1 }], rows.map(r => [esc(r.label), fmtN(r.value, met.dec || 0), fmtN(r.group.commits.length)]));
    return hbarChart(body, rows, met, colorFn);
  }
  const dim = TIME_DIMS.includes(w.dim) ? w.dim : "week";
  let buckets, series;
  if (w.split) ({ buckets, series } = splitSeries(commits, dim, w.metric, w.split));
  else { const rows = aggregate(commits, dim, w.metric); buckets = rows; series = [{ name: met.label, color: "var(--s1)", values: rows.map(r => r.value) }]; }
  if (tbl) return body.innerHTML = tableFromRows([{ l: DIMS[dim].label }, ...series.map(s => ({ l: s.name, n: 1 }))], buckets.map((b, i) => [esc(b.label), ...series.map(s => fmtN(s.values[i], met.dec || 0))]));
  if (w.type === "line") lineChart(body, buckets, series, met);
  else columnChart(body, buckets, series, met, w.type === "stacked");
}
function heatTable(commits, metKey) {
  const rows = aggregate(commits, "weekday", metKey).map(r => [esc(r.label), fmtN(r.value, METRICS[metKey].dec || 0)]);
  return tableFromRows([{ l: "Giorno" }, { l: METRICS[metKey].label, n: 1 }], rows);
}
function renderTableWidget(w, body, commits) {
  if (w.type === "commits") {
    let cs = [...commits].sort((a, b) => b.date.localeCompare(a.date));
    if (w.sort === "worst") cs.sort((a, b) => sevRank(a.worst) - sevRank(b.worst) || b.date.localeCompare(a.date));
    cs = cs.slice(0, w.top || 10);
    if (!cs.length) return body.innerHTML = `<div class="empty">Nessun commit nel periodo</div>`;
    body.innerHTML = `<div class="scroll" style="max-height:420px"><table class="t"><thead><tr><th>Data</th><th>Commit</th><th>Autore</th><th class="n">Q</th><th>Esito</th></tr></thead><tbody>${cs.map(c => `<tr class="click" data-cid="${esc(c.id)}"><td class="muted">${dm(c.date)}</td><td><span class="mono">${esc(c.short)}</span> <span class="ellip" style="display:inline-block;vertical-align:bottom;max-width:260px">${esc(c.message)}</span></td><td>${esc(c.author)}</td><td class="n">${c.quality ?? "—"}</td><td>${c.reviewed ? sevChip(c.worst) : `<span class="muted">non revisionato</span>`}</td></tr>`).join("")}</tbody></table></div>`;
  } else {
    let fs = commits.flatMap(c => c.findings.map(f => ({ ...f, _c: c })));
    const minSev = w.minSeverity || "info";
    fs = fs.filter(f => sevRank(f.severity) <= sevRank(minSev)).sort((a, b) => sevRank(a.severity) - sevRank(b.severity) || b._c.date.localeCompare(a._c.date)).slice(0, w.top || 10);
    if (!fs.length) return body.innerHTML = `<div class="empty">Nessun finding ${minSev !== "info" ? "≥ " + SEV_META[minSev].label : ""} nel periodo ✓</div>`;
    body.innerHTML = `<div class="scroll" style="max-height:420px"><table class="t"><thead><tr><th>Severità</th><th>Gate</th><th>Messaggio</th><th>Autore</th><th>Data</th></tr></thead><tbody>${fs.map(f => `<tr class="click" data-cid="${esc(f._c.id)}"><td>${sevChip(f.severity)}</td><td class="mono" style="white-space:nowrap">${esc(f.rule_id)}</td><td><div>${esc(f.message)}</div>${f.file ? `<div class="muted mono">${esc(f.file)}</div>` : ""}</td><td>${esc(f._c.author)}</td><td class="muted">${dm(f._c.date)}</td></tr>`).join("")}</tbody></table></div>`;
  }
}
const sevRank = s => s === "clean" ? 9 : SEV.indexOf(s) < 0 ? 8 : SEV.indexOf(s);

function widgetSubtitle(w) {
  const parts = [];
  if (w.type === "kpi" && (METRICS[w.metric]?.label || "").toLowerCase() === (w.title || "").toLowerCase() && !Object.values(w.filters || {}).some(Boolean)) return "";
  if (w.type !== "commits" && w.type !== "findings") parts.push(METRICS[w.metric]?.label);
  if (w.dim && DIMS[w.dim] && w.type !== "kpi" && w.type !== "heatmap") parts.push("per " + DIMS[w.dim].label.toLowerCase());
  if (w.split) parts.push("suddiviso per " + DIMS[w.split].label.toLowerCase());
  const f = w.filters || {};
  if (f.repo) parts.push(f.repo); if (f.author) parts.push(f.author); if (f.family) parts.push("branch " + FAM_LABEL[f.family]);
  if (f.severity) parts.push("con finding " + SEV_META[f.severity].label);
  return parts.filter(Boolean).join(" · ");
}

const DEFAULT_DASH = {

/** Barra «Oggi» della panoramica: critical, completezza dati, andamento quality. */
function todayStrip() {
  const [from, to] = rangeBounds(), cs = applyFilters(S.commits);
  const crit = cs.flatMap(c => c.findings.filter(f => f.severity === "critical").map(f => ({ ...f, _c: c })));
  const err = cs.reduce((n, c) => n + c.findings.filter(f => f.severity === "error").length, 0);
  const bad = S.days.filter(d => !d.fetch_ok && d.date >= from && d.date <= to);
  const unrev = cs.filter(c => !c.reviewed).length;
  const last = lastDay();
  const q = (x, y) => avg(S.commits.filter(c => c.day >= x && c.day <= y && c.quality != null && (!S.f.repo || c.repo === S.f.repo) && (!S.f.author || c.author === S.f.author)).map(c => c.quality));
  const qb = q(addDays(last, -29), last), qa = q(addDays(last, -59), addDays(last, -30)), qd = qb != null && qa != null ? qb - qa : null;
  const p = ["<strong>Oggi</strong>"];
  p.push(crit.length
    ? '<a role="button" tabindex="0" style="cursor:pointer" data-cid="' + esc(crit[0]._c.id) + '"><span style="color:var(--status-critical)">⛔</span><span><strong>' + crit.length + '</strong> finding critical da discutere</span><span class="lnk">' + esc(crit[0].rule_id) + ' · ' + esc(crit[0]._c.author) + ' · ' + dm(crit[0]._c.day) + '</span></a>'
    : '<span><span style="color:var(--status-good)">✓</span> Nessun finding critical</span>');
  if (err) p.push('<span><span style="color:var(--status-serious)">✖</span> ' + err + ' error</span>');
  p.push(bad.length
    ? '<a href="#/reports"><span>⚠</span><span>Raccolta git fallita il ' + bad.map(d => dm(d.date)).join(", ") + '</span><span class="lnk">— dati incompleti</span></a>'
    : '<span><span style="color:var(--status-good)">✓</span> Dati completi</span>');
  if (unrev) p.push('<span class="muted">' + unrev + ' commit non revisionati</span>');
  if (qb != null) p.push('<span class="q">Quality 30 gg <strong>' + fmtN(qb, 1) + '</strong>' + (qd != null ? ' <span style="color:' + (qd >= 0 ? "var(--delta-up)" : "var(--delta-down)") + ';font-weight:700">' + (qd >= 0 ? "▲ +" : "▼ ") + fmtN(qd, 1) + '</span> vs 30 gg prec.' : "") + '</span>');
  return '<div class="today">' + p.join("") + '</div>';
}

/** Ridimensionamento trascinando il bordo destro: aggancio a ¼ ⅓ ½ ⅔ intera. */
function startResize(e, w, card) {
  e.preventDefault();
  const grid = $("#wgrid"), colW = (grid.getBoundingClientRect().width + 16) / 12, sx = e.clientX, sw = w.w || 6, SN = WIDTHS.map(x => x[0]);
  card.classList.add("resizing");
  const mv = ev => {
    const raw = sw + (ev.clientX - sx) / colW, snap = SN.reduce((a, b) => Math.abs(b - raw) < Math.abs(a - raw) ? b : a);
    if (snap !== w.w) { w.w = snap; card.className = card.className.replace(/\bw\d+\b/, "w" + snap); $$(".wchips button", card).forEach(b => b.classList.toggle("on", +b.dataset.w === snap)); }
  };
  const up = async () => { removeEventListener("mousemove", mv); removeEventListener("mouseup", up); card.classList.remove("resizing"); renderWidget(w, card); if (w.w !== sw) await persistDashboards(); };
  addEventListener("mousemove", mv); addEventListener("mouseup", up);
}

function coverageBanner() {
  const [from, to] = rangeBounds();
  const bad = S.days.filter(d => !d.fetch_ok && d.date >= from && d.date <= to);
  const unreviewed = applyFilters(S.commits).filter(c => !c.reviewed).length;
  const msgs = [];
  if (bad.length) msgs.push(`⚠ Raccolta git fallita in ${bad.length} giorn${bad.length === 1 ? "o" : "i"} del periodo (${bad.map(d => dm(d.date)).join(", ")}): i dati possono essere incompleti.`);
  if (unreviewed) msgs.push(`${unreviewed} commit raccolti ma non revisionati dall'AI.`);
  return msgs.length ? `<div class="banner">${msgs.join(" ")}</div>` : "";
}

const MESI_L = ["Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno", "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre"];
function dayCard(d) {
  const cs = S.commits.filter(c => c.day === d.date), by = {};
  cs.flatMap(c => c.findings).forEach(f => by[f.severity] = (by[f.severity] || 0) + 1);
  const sev = SEV.filter(s => by[s]).map(s => '<span class="sev ' + s + '">' + SEV_META[s].icon + ' ' + by[s] + ' ' + SEV_META[s].label + '</span>').join("") || (cs.some(c => c.reviewed) ? sevChip("clean") : "");
  const docs = [d.docs.includes("digest.md") && "digest", d.docs.includes("briefing.md") && "briefing"].filter(Boolean).join(" · ") || "nessun documento";
  const qp = d.quality != null ? Math.max(0, Math.min(100, (d.quality - 5) / 5 * 100)) : 0;
  return '<a class="day ' + (d.fetch_ok ? "" : "fail") + '" href="#/reports/' + d.date + '"><div class="top"><span class="wd">' + GIORNI[(parseDay(d.date).getDay() + 6) % 7] + '</span><span class="dd">' + dm(d.date) + '</span><span class="n">' + d.commits + ' commit</span></div>' +
    '<div class="qr"><span>Quality</span><strong>' + (d.quality != null ? fmtN(d.quality, 1) : "—") + '</strong><span class="trk"><i style="width:' + qp + '%"></i></span></div>' +
    (d.fetch_ok ? "" : '<span class="flag">⚠ Raccolta git fallita — dati parziali</span>') +
    (sev ? '<div class="sevs">' + sev + '</div>' : "") + '<div class="meta">' + docs + '</div></a>';
}

const CF = { q: "", family: "", severity: "", reviewed: "", sort: "date", dir: -1, page: 0 };
function viewCommits() {
  setTitle("Storico commit");
  $("#main").innerHTML = `<h1>Storico commit e review</h1><p class="lede">Ogni commit raccolto con l'esito della review. Clicca una riga per finding, file e diff.</p>
    <div class="toolbar">
      <input class="ctl" id="cf-q" placeholder="Cerca messaggio, hash, branch, file…" style="min-width:280px" value="${esc(CF.q)}">
      <select class="ctl" id="cf-family"><option value="">Tutti i tipi di branch</option>${FAMILIES.map(f => `<option value="${f}" ${CF.family === f ? "selected" : ""}>${FAM_LABEL[f]}</option>`).join("")}</select>
      <select class="ctl" id="cf-sev"><option value="">Qualsiasi esito</option>${SEV.map(s => `<option value="${s}" ${CF.severity === s ? "selected" : ""}>con ${SEV_META[s].label}</option>`).join("")}</select>
      <select class="ctl" id="cf-rev"><option value="">Revisionati e non</option><option value="yes" ${CF.reviewed === "yes" ? "selected" : ""}>Solo revisionati</option><option value="no" ${CF.reviewed === "no" ? "selected" : ""}>Solo non revisionati</option></select>
      <span class="muted" id="cf-count" style="margin-left:auto"></span>
    </div><section class="card" id="cf-table"></section>`;
  const upd = () => { CF.page = 0; drawCommits(); };
  $("#cf-q").oninput = e => { CF.q = e.target.value; upd(); };
  $("#cf-family").onchange = e => { CF.family = e.target.value; upd(); };
  $("#cf-sev").onchange = e => { CF.severity = e.target.value; upd(); };
  $("#cf-rev").onchange = e => { CF.reviewed = e.target.value; upd(); };
  drawCommits();
}
function drawCommits() {
  const q = CF.q.toLowerCase();
  let cs = applyFilters(S.commits, { family: CF.family, severity: CF.severity, reviewed: CF.reviewed });
  if (q) cs = cs.filter(c => [c.message, c.short, c.branch, c.author, c.repo, ...c.files].some(s => (s || "").toLowerCase().includes(q)));
  const key = { date: c => c.date, quality: c => c.quality ?? -1, churn: c => c.ins + c.del, worst: c => -sevRank(c.worst), author: c => c.author }[CF.sort];
  cs.sort((a, b) => (key(a) > key(b) ? 1 : key(a) < key(b) ? -1 : 0) * CF.dir);
  $("#cf-count").textContent = `${cs.length} commit`;
  const P = 50, pages = Math.ceil(cs.length / P);
  $("#cf-table").innerHTML = commitTable(cs.slice(CF.page * P, CF.page * P + P), true) +
    (pages > 1 ? `<div class="toolbar" style="margin:12px 0 0;justify-content:center">${Array.from({ length: pages }, (_, i) => `<button class="btn sm ${i === CF.page ? "primary" : ""}" data-p="${i}">${i + 1}</button>`).join("")}</div>` : "");
  $$("#cf-table [data-p]").forEach(b => b.onclick = () => { CF.page = +b.dataset.p; drawCommits(); });
  $$("#cf-table th[data-s]").forEach(th => th.onclick = () => { const s = th.dataset.s; CF.dir = CF.sort === s ? -CF.dir : -1; CF.sort = s; drawCommits(); });
}
function commitTable(cs, sortable) {
  if (!cs.length) return `<div class="empty">Nessun commit</div>`;
  const th = (l, s, n) => sortable && s ? `<th class="sort ${n ? "n" : ""}" data-s="${s}">${l}${CF.sort === s ? (CF.dir > 0 ? " ↑" : " ↓") : ""}</th>` : `<th class="${n ? "n" : ""}">${l}</th>`;
  return `<div class="scroll" style="max-height:none"><table class="t"><thead><tr>${th("Data", "date")}${th("Repo")}${th("Branch")}${th("Commit")}${th("Autore", "author")}${th("+/−", "churn", 1)}${th("Quality", "quality", 1)}${th("Esito", "worst")}</tr></thead><tbody>
  ${cs.map(c => `<tr class="click" data-cid="${esc(c.id)}"><td class="muted" style="white-space:nowrap">${dm(c.date)} ${c.date.slice(11, 16)}</td><td>${esc(c.repo)}</td>
    <td><span class="pill fam" style="--c:${FAM_COLOR[family(c.branch)]}" title="${esc(c.branch)}">${esc(c.branch.length > 30 ? "…" + c.branch.slice(-29) : c.branch)}</span></td>
    <td><span class="mono">${esc(c.short)}</span> ${esc(c.message)}</td><td style="white-space:nowrap">${esc(c.author)}</td>
    <td class="n" style="white-space:nowrap">+${c.ins} −${c.del}</td><td class="n">${c.quality ?? "—"}</td>
    <td>${c.reviewed ? sevChip(c.worst) + (c.findings.length ? ` <span class="muted">(${c.findings.length})</span>` : "") : `<span class="muted">non revisionato</span>`}</td></tr>`).join("")}
  </tbody></table></div>`;
}

function viewAuthors() {
  setTitle("Autori");
  const cs = applyFilters(S.commits);
  const rows = [...group(cs, "author").values()].map(g => {
    const fs = g.findings, gates = {};
    fs.forEach(f => gates[f.rule_id] = (gates[f.rule_id] || 0) + 1);
    const top = Object.entries(gates).sort((a, b) => b[1] - a[1])[0];
    return { a: g.key, n: g.commits.length, q: METRICS.quality.f(g), crit: fs.filter(f => f.severity === "critical" || f.severity === "error").length, warn: fs.filter(f => f.severity === "warning").length,
      info: fs.filter(f => f.severity === "info").length, churn: METRICS.churn.f(g), size: METRICS.avg_size.f(g), top, last: g.commits.map(c => c.date).sort().pop() };
  }).sort((a, b) => b.n - a.n);

// ═════════════════════════════════════════════════════════════
//  MARKDOWN (sottoinsieme sicuro: tutto escapato prima)
// ═════════════════════════════════════════════════════════════
function inl(s) {
  return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])_([^_]+)_(?=[\s).,;:]|$)/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => {
      const day = u.match(/^(\d{4}-\d{2}-\d{2})\//); const href = day ? `#/reports/${day[1]}` : /^https?:/.test(u) ? u : "#";
      return `<a href="${href}" ${/^https?:/.test(u) ? 'target="_blank" rel="noopener"' : ""}>${t}</a>`; });
}
function md(src) {
  const L = (src || "").split("\n"); let out = "", i = 0;
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { let b = []; i++; while (i < L.length && !/^```/.test(L[i])) b.push(L[i++]); i++; out += `<pre><code>${esc(b.join("\n"))}</code></pre>`; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)/); if (h) { out += `<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`; i++; continue; }
    if (/^---+\s*$/.test(l)) { out += "<hr style='border:0;border-top:1px solid var(--border)'>"; i++; continue; }
    if (/^\|/.test(l)) { const rows = []; while (i < L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.replace(/^\||\|\s*$/g, "").split("|").map(c => c.trim());
      const body = rows.filter((r, k) => !(k === 1 && /^\|[\s:|-]+\|?\s*$/.test(r)));
      out += `<table><thead><tr>${cells(body[0]).map(c => `<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${body.slice(1).map(r => `<tr>${cells(r).map(c => `<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`; continue; }
    if (/^>/.test(l)) { const b = []; while (i < L.length && /^>/.test(L[i])) b.push(L[i++].replace(/^>\s?/, "")); out += `<blockquote>${md(b.join("\n"))}</blockquote>`; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(l)) { const ol = /^\s*\d+\./.test(l); const b = [];
      while (i < L.length && (/^\s*([-*]|\d+\.)\s+/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && b.length))) {
        if (/^\s*([-*]|\d+\.)\s+/.test(L[i]) && !/^\s{4,}/.test(L[i])) b.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/, "")); else b[b.length - 1] += "<br>" + inl(L[i].trim()).replace(/^/, "");
        i++; }
      out += `<${ol ? "ol" : "ul"}>${b.map(x => `<li>${x.includes("<br>") ? inl(x.split("<br>")[0]) + "<br>" + x.split("<br>").slice(1).join("<br>") : inl(x)}</li>`).join("")}</${ol ? "ol" : "ul"}>`; continue; }
    if (!l.trim()) { i++; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(#|\||>|```|\s*([-*]|\d+\.)\s|---)/.test(L[i])) p.push(L[i++]);
    if (!p.length) { out += `<p>${inl(l)}</p>`; i++; continue; }
    out += `<p>${p.map(inl).join("<br>")}</p>`;
  }
  return out;
}

    const [data, dash] = await Promise.all([api("/api/dataset"), api("/api/dashboards")]);
    S.data = data; S.commits = data.commits; S.days = data.days; S.repos = data.repos; S.dashboards = dash.dashboards;
    initFilters(); route();
  } catch (e) { $("#main").innerHTML = `<div class="empty">Errore nel caricamento dei dati: ${esc(e.message)}</div>`; }
})();
</script>
</body>
